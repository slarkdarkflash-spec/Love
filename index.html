<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>آزمون عشق</title>
<style>
body{margin:0;font-family:tahoma;background:linear-gradient(135deg,#ff758c,#ff7eb3);display:flex;justify-content:center;align-items:center;height:100vh}
.card{background:#fff;padding:25px;border-radius:20px;max-width:420px;width:90%;text-align:center;box-shadow:0 10px 30px #0003}
button{padding:12px 24px;border:0;border-radius:20px;margin:8px;font-size:18px;cursor:pointer}
.y{background:#e91e63;color:#fff}.n{background:#ddd}.hide{display:none}
.heart{position:fixed;top:-20px;animation:f 5s linear forwards} @keyframes f{to{transform:translateY(110vh);opacity:0}}
</style></head><body>
<div class="card">
<div id=s><h2>❤️ آزمون محرمانه عشق</h2><button class=y onclick="st()">شروع</button></div>
<div id=q class=hide><h3 id=t></h3><button class=y onclick="nx()">بله</button><button class=n onclick="nx()">خیر</button></div>
<div id=r class=hide></div></div>
<script>
const a=["آیا امروز لبخند زدی؟","آیا کنار من خوش میگذره؟","اگر دوباره انتخاب کنی منو انتخاب میکنی؟","آیا همیشه کنارم میمونی؟"];let i=0;
function st(){s.classList.add('hide');q.classList.remove('hide');t.innerHTML=a[0]}
function nx(){i++;if(i<a.length)t.innerHTML=a[i];else{q.classList.add('hide');r.classList.remove('hide');r.innerHTML="<h2>🎉 نتیجه</h2><p>❤️ میزان علاقه: 100%</p><p><b>دوستت دارم تا بی‌نهایت ❤️</b></p>";setInterval(()=>{let h=document.createElement('div');h.className='heart';h.style.left=Math.random()*100+'vw';h.innerHTML='❤️';document.body.appendChild(h);setTimeout(()=>h.remove(),5000)},250)}}
</script></body></html>
